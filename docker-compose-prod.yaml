services:
  mongodb:
    image: mongo:latest
    container_name: nammongodb-prod
    ports:
      - "27019:27017"
    volumes:
      - mongodb_prod_data:/data/db
    networks:
      - product-prod-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  product-api:
    image: thihien/product-api:1.1
    container_name: product-api-prod
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/productdb
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - product-prod-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mongodb_prod_data:

networks:
  product-prod-network:
    driver: bridge
