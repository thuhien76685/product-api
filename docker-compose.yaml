

services:
  mongodb:
    image: mongo:latest
    container_name: nammongodb-compose
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - product-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  
  product-api:
    build: .
    container_name: product-api-compose
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/productdb
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - product-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
volumes:
  mongodb_data:

networks:
  product-network:
    driver: bridge